
name: Unzip Uploaded Folder

on:
  push:
    paths:
      - '*.zip' # يعمل التلقائي عند رفع أي ملف zip

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Files
        run: |
          for file in *.zip; do
            if [ -f "$file" ]; then
              unzip -o "$file"
              rm "$file"
            fi
          done

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Unzipped folder contents" || exit 0
          git push
